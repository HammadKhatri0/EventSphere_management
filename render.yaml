# Render Blueprint: the Node API only. The React app is hosted on Vercel (frontend/vercel.json proxies /api and /uploads here).
# Secrets marked `sync: false` are entered in the Render dashboard (never committed).
services:
  - type: web
    name: eventsphere
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci --omit=dev
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: mongo_uri
        sync: false
      - key: CLIENT_URL
        sync: false          # your Vercel URL, e.g. https://eventsphere.vercel.app (CORS, websockets, reset links)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ORGANIZER_INVITE_CODE
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: EventSphere <no-reply@eventsphere.com>

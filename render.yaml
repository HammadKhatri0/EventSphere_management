# Render Blueprint: one web service that builds the React app and serves it from the Node API.
# Secrets marked `sync: false` are entered in the Render dashboard (never committed).
services:
  - type: web
    name: eventsphere
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: mongo_uri
        sync: false
      - key: CLIENT_URL
        sync: false          # your public URL, e.g. https://eventsphere.onrender.com
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ORGANIZER_INVITE_CODE
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: CLOUD_API_KEY
        sync: false
      - key: CLOUD_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 2525
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: EventSphere <no-reply@eventsphere.com>
